# Compact Bridge parameter record, NOT directly consumed by all historical scripts.
# Requires independent camera reconstruction before training/evaluation.

dataset:
  name: compact_bridge
  image_dir: PROVIDE_AUTHORIZED_DATASET/images
  mask_dir: PROVIDE_AUTHORIZED_DATASET/masks
  transforms: NOT_RELEASED_CAMERA_POSES
  source_mapping: PROVIDE_AUTHORIZED_DATASET/metadata/image_source_mapping.csv
  total_images: 600
  uav_images: 331
  phone_images: 269
  image_width: 960
  image_height: 540

retrieval:
  backbone: DINOv2 ViT-S/14
  descriptor: 384-dimensional CLS token
  cross_source_top_k: 20
  within_source_top_k: 20
  cosine_similarity_cutoff: null

matching:
  local_matcher: ALIKED-N16 + LightGlue
  minimum_tentative_matches: 8
  minimum_verified_inliers: 30
  initial_inlier_ratio_cutoff: 0.0
  expanded_pair_inlier_ratio_cutoff: 0.25
  geometric_verification: fundamental_matrix_RANSAC
  reprojection_threshold_pixels: 2.0

guided_expansion:
  neighbourhood_radius_uav_frames: 2
  neighbourhood_radius_phone_frames: 1
  max_new_candidates_per_uav_image: 4
  max_new_candidates_per_phone_image: 2

nerfacto:
  maximum_training_steps: 15000
  large_span_train_eval: 350/50
  compact_bridge_train_eval: 525/75
  image_downscale_factor: 2

repeatability:
  seeds: [42, 43, 44]
  standard_nerfacto_steps: 15000
  bridge_finetuning_steps: 5000
  residual_refinement_steps: 12000
